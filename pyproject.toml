[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "emabox"
version = "0.1.0"
description = "A small, multi-application AI inference gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "google-genai>=1.0,<3",
  "openai>=2.0,<4",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10", "pytest-asyncio>=0.23,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emabox = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
